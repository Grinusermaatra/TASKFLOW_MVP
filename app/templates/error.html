{% extends "base.html" %}
{% block title %}Error {{ status_code }} · TaskFlow{% endblock %}
{% block heading %}Error{% endblock %}
{% block content %}
<section class="rounded-3xl bg-white p-6 shadow-card">
  <p class="text-sm font-semibold text-indigo-600">{{ status_code }}</p>
  <h1 class="mt-1 text-2xl font-semibold">No se pudo completar la acción</h1>
  <p class="mt-3 text-slate-600">{{ message }}</p>
  <div class="mt-6 flex flex-col gap-3 sm:flex-row">
    <a href="/tareas" class="btn-primary">Ir a tareas</a>
    <a href="/login" class="btn-secondary">Iniciar sesión</a>
  </div>
</section>
{% endblock %}
