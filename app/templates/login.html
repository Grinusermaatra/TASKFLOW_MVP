{% extends "base.html" %}
{% block title %}Iniciar sesión · TaskFlow{% endblock %}
{% block content %}
<section class="mx-auto mt-8 max-w-md rounded-3xl bg-white p-6 shadow-card">
  <div class="mb-6 flex items-center gap-3">
    <span class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-600 text-xl font-bold text-white">T</span>
    <div>
      <h1 class="text-2xl font-semibold">TaskFlow</h1>
      <p class="text-sm text-slate-500">Tareas para supervisores y colaboradores</p>
    </div>
  </div>
  {% if error %}
  <p class="mb-4 rounded-2xl bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div>
      <label for="username" class="mb-1 block text-sm font-medium">Usuario</label>
      <input id="username" name="username" autocomplete="username" required value="{{ username }}" class="field">
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required class="field">
    </div>
    <button type="submit" class="btn-primary w-full">Iniciar sesión</button>
  </form>
  <p class="mt-4 text-sm text-slate-500">Pide una invitación a tu supervisor para registrarte.</p>
</section>
{% endblock %}
